- ? "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/\
     ieee802-dot1q-sched-bridge:gate-parameter-table"
  : queue-max-sdu-table:
    - traffic-class: 0
      queue-max-sdu: 128
    - traffic-class: 1
    - traffic-class: 2
    - traffic-class: 3
      queue-max-sdu: 256
    - traffic-class: 4
    - traffic-class: 5
    - traffic-class: 6
    - traffic-class: 7
      queue-max-sdu: 512
    gate-enabled: true
    admin-gate-states: 133
    oper-gate-states: 128
    admin-control-list:
      gate-control-entry:
      - index: 1
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 10000000
        gate-states-value: 1
      - index: 2
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 40000000
        gate-states-value: 8
      - index: 3
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 90000000
        gate-states-value: 128
    oper-control-list:
      gate-control-entry:
      - index: 1
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 10000000
        gate-states-value: 1
      - index: 2
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 40000000
        gate-states-value: 8
      - index: 3
        operation-name: ieee802-dot1q-sched:set-gate-states
        time-interval-value: 90000000
        gate-states-value: 128
    admin-cycle-time:
      numerator: 140000000
      denominator: 1000000000
    oper-cycle-time:
      numerator: 140000000
      denominator: 1000000000
    admin-cycle-time-extension: 10000000
    oper-cycle-time-extension: 10000000
    admin-base-time:
      seconds: '20'
      nanoseconds: 0
    oper-base-time:
      seconds: '20'
      nanoseconds: 0
    config-change: true
    config-change-time:
      seconds: '20'
      nanoseconds: 0
    tick-granularity: 30
    current-time:
      seconds: '23'
      nanoseconds: 835093398
    config-pending: false
    config-change-error: '0'
    supported-list-max: 8
    supported-cycle-max:
      numerator: 1000000000
      denominator: 1000000001
    supported-interval-max: 4294967295
    

