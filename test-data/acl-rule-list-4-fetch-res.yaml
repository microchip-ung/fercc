- ? "/mchp-velocitysp-acl:acl/acl-rules/rule-list"
  : id: 5
    ingress-port-list:
    - '1'
    dmac: 00-00-00-00-00-00
    dmac-mask: 00-00-00-00-00-00
    smac: 00-00-00-00-00-00
    smac-mask: 00-00-00-00-00-00
    tagged: any
    vid: 0
    vid-mask: 0
    pcp: 0
    pcp-mask: 0
    dei: any
    frame-ipv4:
      fragment: any
      options: any
      sip: 1.2.3.4/16
      dip: 0.0.0.0/0
      ttl: any
      proto: 17
      proto-mask: 255
      ds: 0
      ds-mask: 0
      data: 0
      data-mask: 0
      sport-min: 10
      sport-max: 20
      dport-min: 0
      dport-max: 0
      tcp-fin: any
      tcp-syn: any
      tcp-rst: any
      tcp-psh: any
      tcp-ack: any
      tcp-urg: any
    forwarding: filter
    egress-port-list:
    - '2'
    - '3'
    policer-enable: false
    policer-index: 0
    rx-count: 0
    

