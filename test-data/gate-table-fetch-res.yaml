- ? "/ietf-interfaces:interfaces/interface/ieee802-dot1q-bridge:bridge-port/\
     ieee802-dot1q-sched-bridge:gate-parameter-table"
  : queue-max-sdu-table:
    - traffic-class: 0
    - traffic-class: 1
    - traffic-class: 2
    - traffic-class: 3
    - traffic-class: 4
    - traffic-class: 5
    - traffic-class: 6
    - traffic-class: 7
    oper-gate-states: 255
    admin-control-list:
      gate-control-entry: []
    oper-control-list:
      gate-control-entry: []
    admin-cycle-time:
      numerator: 0
      denominator: 1
    oper-cycle-time:
      numerator: 0
      denominator: 1
    admin-cycle-time-extension: 256
    oper-cycle-time-extension: 256
    admin-base-time:
      seconds: '0'
      nanoseconds: 0
    oper-base-time:
      seconds: '0'
      nanoseconds: 0
    config-change: false
    config-change-time:
      seconds: '0'
      nanoseconds: 0
    tick-granularity: 30
    current-time:
      seconds: '11'
      nanoseconds: 369956254
    config-pending: false
    config-change-error: '0'
    supported-list-max: 8
    supported-cycle-max:
      numerator: 1000000000
      denominator: 1000000001
    supported-interval-max: 4294967295
    

